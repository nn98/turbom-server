name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run tests
        run: mvn test --no-transfer-progress

      - name: Clean workspace
        if: always()
        run: rm -rf target

  deploy:
    runs-on: self-hosted
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build JAR
        run: mvn package -DskipTests --no-transfer-progress

      - name: Backup current JAR
        run: |
          if [ -f /home/ubuntu/turbom-server/target/server-0.1.0.jar ]; then
            cp /home/ubuntu/turbom-server/target/server-0.1.0.jar /home/ubuntu/turbom-server/target/server-0.1.0.jar.bak
          fi

      - name: Load new seed chunks
        run: bash scripts/mysql/load-new-chunks.sh

      - name: Deploy JAR
        run: cp target/server-0.1.0.jar /home/ubuntu/turbom-server/target/

      - name: Clean workspace
        if: always()
        run: rm -rf target

      - name: Restart service
        run: |
          sudo systemctl restart turbom-server.service

      - name: Verify sangga service key is present on the service
        run: |
          if sudo systemctl show turbom-server.service --property=Environment | grep -q SANGGA_SERVICE_KEY; then
            echo "SANGGA_SERVICE_KEY is set on turbom-server.service"
          else
            echo "::warning::SANGGA_SERVICE_KEY missing from turbom-server.service environment"
          fi

      - name: Verify
        run: |
          for i in $(seq 1 30); do
            if curl -sf -G https://turbom.duckdns.org/api/sites/search --data-urlencode "query=성남" > /dev/null; then
              echo "OK"
              exit 0
            fi
            sleep 2
          done
          echo "::error::service did not become healthy"
          sudo journalctl -u turbom-server.service -n 30 --no-pager
          exit 1
